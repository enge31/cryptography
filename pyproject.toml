[build-system]
requires = ["setuptools", "wheel"]
build-backend = "_buildutils"
[project]
name = "cryptox"
version = "0.1.0"
description = "A modern, pure-Python cryptography library with a clean API"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Cryptox Contributors" },
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/example/cryptox"
Documentation = "https://cryptox.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]